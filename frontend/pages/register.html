<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Likely</title>
    <link rel="stylesheet" href="../styles/register.css">
</head>
<body>

    <div class="register-container">
        <div class="logo-container">
            <a href="index.html" class="logo-link">
                <svg class="logo-icon" viewBox="0 0 24 24">
                    <path d="M12 2L2 22H22L12 2Z"/>
                </svg>
                <span class="logo-text">Likely</span>
            </a>
        </div>

        <h1>Crear Cuenta</h1>

        <form id="registerForm">
            <div class="form-group">
                <input type="text" id="fullName" name="fullName" placeholder="Nombre completo" required>
            </div>
            <div class="form-group">
                <input type="email" id="email" name="email" placeholder="Correo electrónico" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" name="password" placeholder="Contraseña" required>
            </div>
            <div class="form-group">
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirmar contraseña" required>
            </div>
            <button type="submit" class="btn-register">Registrarse</button>
        </form>

        <div class="login-link">
            ¿Ya tienes una cuenta? <a href="login.html">Inicia Sesión</a> </div>
    </div>

</body>
</html>
