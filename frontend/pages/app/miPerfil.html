<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Likely</title>
    <link rel="stylesheet" href="../../styles/appStyles/miPerfil.css" />
</head>
<!-- Permite que no cargue el contenido antes de comprobar que el usuario esta logeado -->
<body style="display: none">
    <script src="../../js/appJs/utils/guardian.js"></script>
    <div class="contenedor">

        <div class="barra-lateral">
            <a href="#" class="app-logo">
                <!-- REVISAR
                El svg nose como funciona en el html, se podría hacer con una imagen. -->
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#ff9800" d="M12 2L2 22H22L12 2Z" />
                </svg>
                <span>Likely</span>
            </a>

            <ul>
                <li><a href="homePage.html">Inicio</a></li>
                <li><a href="miPerfil.html">Perfil</a></li>
                <li><a href="amigos.html">Amigos</a></li>
                <li><a href="configuracion.html">Configuración</a></li>
                <li><a href="#">Cerrar sesión</a></li>
            </ul>
        </div>

        <div class="contenido">

            <!-- Cabecera de Mi Perfil (Editable) -->
            <div class="cabecera-mi-perfil" id="cabeceraMiPerfil">
                <div class="avatar-contenedor-editable">
                    <img src="https://placehold.co/100x100/888/FFF?text=Yo" alt="Mi Avatar"
                        class="imagen-avatar-mi-perfil" id="miAvatarActual">
                    <button class="boton-cambiar-avatar" id="botonCambiarMiAvatar">Cambiar Foto</button>
                    <input type="file" id="inputMiAvatar" accept="image/*" style="display: none;">
                </div>
                <div class="info-editable-mi-perfil">
                    <h2 class="nombre-usuario-mi-perfil" id="miNombreDePerfil">Cargando nombre...</h2>
                    <div class="bio-contenedor-editable" id="contenedorMiBio">
                        <p class="texto-mi-bio" id="textoMiBioActual">Cargando biografía...</p>
                        <textarea class="input-mi-bio" id="inputMiBio" rows="4" style="display: none;"
                            placeholder="Escribe algo sobre ti... (máx. 200 caracteres)"></textarea>
                    </div>
                    <button class="boton-editar-bio" id="botonEditarMiBio">Editar Biografía</button>
                    <div class="acciones-edicion-bio" id="botonesAccionMiBio" style="display: none;">
                        <button class="boton-guardar" id="botonGuardarMiBio">Guardar</button>
                        <button class="boton-cancelar" id="botonCancelarMiBio">Cancelar</button>
                    </div>
                </div>
            </div>

            <!-- Título para Mis Publicaciones -->
            <h3 class="titulo-seccion-mis-publicaciones" id="tituloMisPublicaciones">Mis Publicaciones</h3>

            <!-- Filtros de categoría (reutilizando clases de perfilAmigo.html / homePage.html) -->
            <div class="filtros-inicio" id="filtrosMisPublicaciones">
                <button data-categoria="todo" class="activo">Todo</button>
                <button data-categoria="pelicula">Películas</button>
                <button data-categoria="serie">Series</button>
                <button data-categoria="musica">Música</button>
                <!-- Añade más según tus categorías -->
            </div>

            <!-- Contenedor para las tarjetas de publicaciones (reutilizando clases de perfilAmigo.html / homePage.html) -->
            <section class="publicaciones-inicio" id="rejillaMisPublicaciones">
                <!-- Mis publicaciones se insertarán aquí mediante JavaScript -->
            </section>
        </div>

        <script src="../../js/appJs/miPerfil.js"></script>
        <script src="../../js/appJs/utils/logout.js"></script>

</html>
