<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23ff9800' d='M12 2L2 22H22L12 2Z'/></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body>

    <div class="login-container">
        <div class="logo-container">
            <a href="index.html" class="logo-link">
                <svg class="logo-icon" viewBox="0 0 24 24">
                    <path d="M12 2L2 22H22L12 2Z"/>
                </svg>
                <span class="logo-text">Likely</span>
            </a>
        </div>

        <h1>Iniciar Sesión</h1>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo</label>
                <input type="email" id="email" name="email" placeholder="Correo" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="btn-login">Iniciar sesión</button>
        </form>

        <div class="register-link">
            ¿No tienes cuenta aún? <a href="register.html">Regístrate</a>
        </div>
    </div>
    <script src="../js/login.js"></script>
</body>
</html>
